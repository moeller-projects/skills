<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      background: #fff;
    }

    header,
    main,
    footer {
      display: block;
    }

    h1, h2, h3 {
      line-height: 1.2;
    }

    @media print {
      body {
        max-width: none;
        padding: 0;
        color: #000;
        background: #fff;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
  </header>

  <main>
    <section aria-labelledby="summary">
      <h2 id="summary">Summary</h2>
    </section>
  </main>

  <footer></footer>
</body>
</html>
